<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login | SRM Outpass</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" defer src="studentLogin.js"></script>
</head>

<body>

<header class="navbar">
    <img src="./images/img.png" class="logo" alt="SRM Logo" />
    <h1>SRM Hostel Outpass - Student Login</h1>
</header>

<div id="message"></div>

<div class="container form-container">
    <h2>Student Login</h2>

    <!-- LOGIN FORM -->
    <form id="loginForm">
        <label>SRM Email ID:</label>
        <input type="email" id="email" placeholder="example@srmist.edu.in" required />

        <label>Password:</label>
        <input type="password" id="password" required />
    </form>

    <div id="studentOptions" class="student-options">
        <button class="btn" onclick="location.href='student_dashboard.html'">
            Apply Outpass
        </button>

        <button class="btn" onclick="location.href='return_entry.html'">
            Return Entry
        </button>
    </div>

    <p class="switch-link">
        Don’t have an account? <a href="student_dashboard.html">Register here</a>
    </p>
</div>

<footer>
    <p>© SRM Institute of Science and Technology</p>
</footer>

</body>
</html>
